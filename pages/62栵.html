<center>《皇矣》</center>
<blockquote>
  <h2 id="古代记载">
    <center>古代记载</center>
  </h2>
</blockquote>
<blockquote>
  <blockquote>
    <p>
      <strong>《毛诗故训传》</strong>
    </p>
    <blockquote>
      <p>栵，栭也。（《毛传》注《皇矣》）</p>
    </blockquote>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <p>
      <strong>《毛诗草木鸟兽虫鱼疏》</strong>
    </p>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <blockquote>
      <p>栵，栭。叶如榆也，木理坚韧而赤，可为车辕。</p>
    </blockquote>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <p>
      <strong>《毛诗正义》</strong>
    </p>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <blockquote>
      <p>郭璞曰：“栭树似槲樕而痺小，子如细栗，今江东呼为栭栗。”陆机《疏》云：“叶如榆也，木理坚韧而赤，可为车辕。”（《毛诗正义》疏《皇矣》）</p>
    </blockquote>
  </blockquote>
</blockquote>
