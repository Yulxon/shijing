<h1 id="楚">

</h1>
<blockquote>
    <h2 id="出现篇目">

    </h2>
</blockquote>
<center>《芣苢》、《黍离》、《扬之水》、《椒聊》、《葛生》、《葛生》、《黄鸟》</center>
<blockquote>
    <h2 id="古代记载">
        <center>古代记载</center>
    </h2>
    <blockquote>
        <p>
            <strong>《〈毛诗传〉笺》</strong>
        </p>
        <blockquote>
            <p>楚，杂薪之中尤翘翘者。（郑玄笺释《芣苢》）</p>
        </blockquote>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <p>
            <strong>《毛诗正义》</strong>
        </p>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>楚亦木名，故《学记》注以楚为荆。（《毛诗正义》疏《芣苢》）</p>
        </blockquote>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>楚木。（《毛诗正义》疏《葛生》）</p>
        </blockquote>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <p>
            <strong>《诗集传》</strong>
        </p>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>楚，木名。荆屬。（《诗集传》集注《芣苢》）</p>
        </blockquote>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>楚、木也。（《诗集传》集注《黍离》、《黄鸟》）</p>
        </blockquote>
    </blockquote>
</blockquote>
<blockquote>
    <h2 id="当代记载">

    </h2>
    <blockquote>
        <p>
            <strong>《中国植物志》</strong>
        </p>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>（是否为植物尚无定论，有人认为是一种类荆的灌木。）  </p>
        </blockquote>
    </blockquote>
