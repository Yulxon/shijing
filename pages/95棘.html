            <p>酸枣 （Ziziphus jujuba var. spinosa）， 鼠李科，枣属植物。本变种常为灌木，叶较小，核果小，近球形或短矩圆形，具薄的中果皮，味酸，核两端钝。花期6-7月，果期8-9月。</p>
        </blockquote>
    </blockquote>
</blockquote>
