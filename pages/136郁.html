<center>《七月》</center>
<blockquote>
  <h2 id="古代记载">
    <center>古代记载</center>
  </h2>
  <blockquote>
    <p>
      <strong>《毛诗故训传》</strong>
    </p>
    <blockquote>
      <p>郁，棣属。（《毛传》注《七月》）</p>
    </blockquote>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <p>
      <strong>《毛诗草木鸟兽虫鱼疏》</strong>
    </p>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <blockquote>
      <p>郁，其树高五六尺，其实大如李，色赤，食之甘。</p>
    </blockquote>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <p>
      <strong>《毛诗正义》</strong>
    </p>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <blockquote>
      <p>正义曰：“郁，棣属”者，是唐棣之类属也。刘稹《毛诗义问》云：“其树高五六尺，其实大如李，正赤，食之甜。”《本草》云：“郁一名雀李，一名车下李，一名棣。生高山川谷或平田中，五月时实。”言一名棣，则与棣相类，故云棣属。
        （《毛诗正义》疏《七月》）</p>
    </blockquote>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <p>

    </p>

</blockquote>
