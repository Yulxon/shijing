<blockquote>
    <blockquote>
        <blockquote>
            <p>楛，其形似荆，而赤茎似蓍，上党人织以为斗，筥箱器，又揉以为钗，故上党人调问妇人“欲买赭否”？曰“灶下自有黄土”。问“买钗否”？曰“山中自有楛”。（《毛传》注《旱麓》）</p>
        </blockquote>
