<center>《南山有台》</center>
<blockquote>
    <h2 id="古代记载">
        <center>古代记载</center>
    </h2>
</blockquote>
<blockquote>
    <blockquote>
        <p>
            <strong>《毛诗草木鸟兽虫鱼疏》</strong>
        </p>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>楰，楸属，其树叶、木理如楸，山楸之异者，今人谓之苦楸，湿时脆，燥时坚，今永昌又谓鼠梓，汉人谓之楰。  </p>
        </blockquote>
    </blockquote>
</blockquote>
<blockquote>
    <h2 id="当代记载">

    </h2>
    <blockquote>
        <p>
            <strong>《中国植物志》</strong>
        </p>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>水榆花楸（Sorbus alnifolia），蔷薇科花楸属植物。花期5月，果期8-9月。产黑龙江、吉林、辽宁、河北、河南、陕西、甘肃、山东、安徽、湖北、江西、浙江、四川。生于山坡、山沟或山顶混交林或灌木丛中，海拔500-2300米。朝鲜和日本也有分布。</p>
        </blockquote>
    </blockquote>
