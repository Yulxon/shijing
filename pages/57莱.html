<center>《南山有台》</center>
<blockquote>
  <h2 id="古代记载">
    <center>古代记载</center>
  </h2>
</blockquote>
<blockquote>
  <blockquote>
    <p>
      <strong>《毛诗故训传》</strong>
    </p>
    <blockquote>
      <p>莱，草也。笺云：兴者，山之有草木，以自覆盖，成其高大，喻人君有贤臣，以自尊显。（《毛传》注《南山有台》）</p>
    </blockquote>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <p>
      <strong>《毛诗草木鸟兽虫鱼疏》</strong>
    </p>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <blockquote>
      <p>莱，草名，其叶可食，今兖州人蒸以为茹，谓之莱蒸。</p>
    </blockquote>
  </blockquote>
</blockquote>
