<body>
<h1 id="台（薹）">
  <center>台（薹）</center>
</h1>
<blockquote>
  <h2 id="出现篇目">
    <center>出现篇目</center>
  </h2>
</blockquote>
<center>《南山有台》</center>
<blockquote>
  <blockquote>
    <p>
      <strong>《毛诗草木鸟兽虫鱼疏》</strong>
    </p>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <blockquote>
      <p>台，夫须，旧说夫须莎草也，可为蓑笠，都人士云台笠缁撮，或云台草有皮，坚细滑致，可为簦笠，南山多有。</p>
    </blockquote>
  </blockquote>
</blockquote>
<blockquote>
  <h2 id="当代记载">
    <center>当代记载</center>
  </h2>
  <blockquote>
    <p>
      <strong>《中国植物志》</strong>
    </p>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <blockquote>
      <p>莎草科，薹草属植物。多年生草本，具地下根状茎。花单性，通常雌雄同株，少数雌雄异株。小坚果较紧或较松地包于果囊内，三棱形或平凸状。</p>
    </blockquote>
  </blockquote>
</blockquote>
<blockquote>
  <blockquote>
    <blockquote>
      <p>本属全世界约有2000多种，我国有近500种，分布于全国各省区。</p>
    </blockquote>
  </blockquote>
</blockquote>
