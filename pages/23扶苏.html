<div class="md">
    <h1 id="扶苏">
        <center>扶苏</center>
    </h1>
    <blockquote>
        <h2 id="出现篇目">
            <center>出现篇目</center>
        </h2>
    </blockquote>
    <center>《山有扶苏》</center>
    <blockquote>
        <h2 id="古代记载">
            <center>古代记载</center>
        </h2>
        <blockquote>
            <p>
                <strong>《毛诗故训传》</strong>
            </p>
            <blockquote>
                <p>扶苏、扶胥，小木也。（《毛传》注《山有扶苏》）</p>
            </blockquote>
        </blockquote>
    </blockquote>
    <blockquote>
        <blockquote>
            <p>
                <strong>《毛诗正义》</strong>
            </p>
        </blockquote>
    </blockquote>
    <blockquote>
        <blockquote>
            <blockquote>
                <p>毛以下章“山有乔松”是木，则扶苏是木可知，而《释木》无文。传言“扶胥，小木”者，毛当有以知之，未详其所出也。…扶胥，山木，宜生于高山。（《毛诗正义》疏《山有扶苏》）</p>
            </blockquote>
        </blockquote>
    </blockquote>
    <blockquote>
        <h2 id="当代记载">
            <center>当代记载</center>
        </h2>
        <blockquote>
            <blockquote>
                <p>未有定论。</p>
            </blockquote>
        </blockquote>
    </blockquote>
    <blockquote>
        <blockquote>
            <blockquote>
                <p>有学者认为“扶苏”是“朴樕”，即郭璞所谓“槲樕”，也就是今天的“槲树”。</p>
            </blockquote>
        </blockquote>
    </blockquote>
    <blockquote>
        <blockquote>
            <blockquote>
                <p>也有学者认为“扶苏”是《诗经》中的“唐棣”。</p>
            </blockquote>
        </blockquote>
    </blockquote>
