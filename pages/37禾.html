<body>
<h1 id="禾">
    <center>禾</center>
</h1>
<blockquote>
    <h2 id="出现篇目">
        <center>出现篇目</center>
    </h2>
</blockquote>
<center>《七月》、《生民》</center>
<blockquote>
    <h2 id="古代记载">
        <center>古代记载</center>
    </h2>
</blockquote>
<center>（整理者认为“禾”在《诗》中泛指谷类作物）</center>
<blockquote>
    <blockquote>
        <p>
            <strong>《说文解字》</strong>
        </p>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>禾，嘉谷也，二月始生，八月而孰，得时之中，故谓之禾。</p>
        </blockquote>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <p>
            <strong>《广雅·释草》</strong>
        </p>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>粢黍稻其采谓之禾。盖凡谷皆以成实为费，禾象穗成，故为嘉谷之通名，谷未秀曰苗，已秀曰禾。</p>
        </blockquote>
    </blockquote>
</blockquote>

</body>
