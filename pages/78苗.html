<center>《硕鼠》</center>
<blockquote>
    <h2 id="古代记载">
        <center>古代记载</center>
    </h2>
    <blockquote>
        <p>
            <strong>《毛诗故训传》</strong>
        </p>
        <blockquote>
            <p>苗，嘉谷也。（《毛传》注《硕鼠》）  </p>
        </blockquote>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <p>
            <strong>《毛诗正义》</strong>
        </p>
    </blockquote>
</blockquote>
<blockquote>
    <blockquote>
        <blockquote>
            <p>正义曰：黍麦指谷实言之，是鼠之所食。苗之茎叶，以非鼠能食之，故云“嘉谷”，谓谷实也。谷生于苗，故言苗以韵句。（《毛诗正义》疏《硕鼠》）</p>
        </blockquote>
    </blockquote>
</blockquote>
